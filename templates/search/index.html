{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotGoogle — Private Search Engine</title>
    <meta name="description" content="NotGoogle is a privacy-first metasearch engine. Search the web without being tracked. No ads, no profiling, just results.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="home-body">

    <!-- Animated background particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- Floating orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <main class="home-main">

        <!-- Logo -->
        <div class="logo-wrapper" id="logoWrapper">
            <div class="logo-icon">
                <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" stroke="url(#logoGrad)" stroke-width="2.5"/>
                    <path d="M12 20 L18 14 L28 20 L18 26 Z" fill="url(#logoGrad)" opacity="0.8"/>
                    <circle cx="20" cy="20" r="4" fill="url(#logoGrad)"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#a855f7"/>
                            <stop offset="100%" style="stop-color:#3b82f6"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1 class="logo-text">
                <span class="logo-not">Not</span><span class="logo-google">Google</span>
            </h1>
            <p class="logo-tagline">Privacy-first metasearch engine</p>
        </div>

        <!-- Search Form -->
        <div class="search-container" id="searchContainer">
            <form action="/search/" method="GET" class="search-form" id="homeSearchForm">
                <div class="search-box-wrapper">
                    <div class="search-input-group">
                        <span class="search-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                        <input
                            type="text"
                            name="q"
                            id="homeSearchInput"
                            class="search-input"
                            placeholder="Search without being tracked..."
                            autocomplete="off"
                            spellcheck="true"
                        />
                        <button type="button" class="clear-btn" id="clearBtn" style="display:none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Autocomplete dropdown -->
                    <ul class="autocomplete-list" id="autocompleteList"></ul>
                </div>

                <!-- Search type selector -->
                <div class="search-type-pills">
                    <button type="submit" name="type" value="web" class="pill pill-active" id="webPill">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                        Web
                    </button>
                    <button type="submit" name="type" value="images" class="pill">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        Images
                    </button>
                    <button type="submit" name="type" value="news" class="pill">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 0-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
                        News
                    </button>
                </div>
            </form>
        </div>

        <!-- Privacy badges -->
        <div class="privacy-badges" id="privacyBadges">
            <div class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                No tracking
            </div>
            <div class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                No ads
            </div>
            <div class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                No profiling
            </div>
            <div class="badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Multiple sources
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="home-footer">
        <p>NotGoogle &copy; 2024 — Open Source, Privacy First</p>
        <p class="footer-sub">Results powered by DuckDuckGo. No cookies. No tracking.</p>
    </footer>

    <script src="{% static 'js/home.js' %}"></script>
</body>
</html>
